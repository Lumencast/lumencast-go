# golangci-lint v2 config for lumencast-go.
#
# v0 stance : pragmatic strictness. The first ship targets a working
# CI baseline ; the follow-up issue tracking #lint-tightening will
# move toward stricter gates as the codebase stabilises.
#
# Spec : https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - gosec
  settings:
    errcheck:
      # Close() calls on resources where the close error doesn't
      # carry meaningful action. Ignored individually rather than
      # globally so the linter still flags business-logic returns.
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (*net/http.Response).Body.Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    gosec:
      excludes:
        # G115 — integer overflow conversions are pervasive in
        # protocol code where seq is uint64 and JSON numbers are
        # float64.
        - G115
        # G301 — 0o755 is correct for human-readable scaffold output
        # and CLI build artefacts.
        - G301
        # G304 — CLI tools intentionally take file paths from
        # arguments. The validation belongs at higher layers.
        - G304
        # G306 — same rationale as G301 for files.
        - G306
    revive:
      rules:
        - name: package-comments
          disabled: true
    staticcheck:
      # Disable QF (quick-fix) rules — they're suggestions not
      # defects. Keep SA (correctness) and ST (style) gates active.
      checks:
        - all
        - "-QF*"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: examples/
        linters:
          - gosec
          - gocritic   # exitAfterDefer in main() of examples is OK
      - path: cmd/lumencast/
        linters:
          - gosec      # CLI tool, file-path access by design
